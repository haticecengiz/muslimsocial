<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ernest Gellner — Müslüman Toplum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:       #c8a45a;
  --gold-light: #e0c47a;
  --navy:       #0d1b2a;
  --navy2:      #152233;
  --navy3:      #1e3048;
  --teal:       #2a7a6a;
  --teal-light: #5ec9b0;
  --brown:      #8b3a2a;
  --brown-light:#e07a6a;
  --text:       #f0e8d8;
  --muted:      #c2d4e0;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--navy);color:var(--text);font-family:'Source Sans 3',sans-serif;overflow:hidden;}

/* ========== PROGRESS BAR ========== */
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-light));z-index:1000;transition:width .35s ease;}

/* ========== SLIDE COUNTER ========== */
#counter{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:600;background:rgba(13,27,42,0.8);color:var(--gold-light);padding:5px 16px;border-radius:20px;border:1px solid rgba(200,164,90,0.3);z-index:900;letter-spacing:0.5px;font-family:'Source Sans 3';}

/* ========== NAV ARROWS ========== */
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(13,27,42,0.7);border:1px solid rgba(200,164,90,0.35);color:var(--gold-light);font-size:22px;cursor:pointer;z-index:900;display:flex;align-items:center;justify-content:center;transition:all .25s;font-family:'Playfair Display',serif;}
.nav-arrow:hover{background:rgba(200,164,90,0.18);border-color:var(--gold);color:#fff;}
#prev-btn{left:14px;}
#next-btn{right:14px;}

/* ========== NAV PANEL ========== */
#nav-toggle{position:fixed;bottom:14px;right:14px;width:38px;height:38px;background:rgba(13,27,42,0.85);border:1px solid var(--gold);border-radius:8px;color:var(--gold-light);font-size:18px;cursor:pointer;z-index:1100;}
#nav-toggle:hover{background:rgba(200,164,90,0.18);}
#nav-panel{position:fixed;top:0;right:0;width:265px;height:100%;background:rgba(13,27,42,0.97);border-left:1px solid rgba(200,164,90,0.25);transform:translateX(100%);transition:transform .35s ease;z-index:1050;overflow-y:auto;padding:54px 0 60px;}
#nav-panel.open{transform:translateX(0);}
#nav-panel .nav-item{padding:9px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .2s;font-size:13px;color:var(--muted);}
#nav-panel .nav-item:hover{background:rgba(200,164,90,0.08);color:var(--text);}
#nav-panel .nav-item.active{border-left-color:var(--gold);background:rgba(200,164,90,0.1);color:var(--gold-light);}
#nav-panel .nav-item .nav-section{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:2px;font-family:'Playfair Display';font-style:italic;}
#nav-panel .nav-item .nav-title{line-height:1.3;font-weight:600;}
#nav-panel::-webkit-scrollbar{width:5px;}
#nav-panel::-webkit-scrollbar-thumb{background:rgba(200,164,90,0.4);border-radius:3px;}

/* ========== SLIDE CONTAINER ========== */
#slides-container{width:100%;height:100%;position:relative;}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;animation:fadeIn .45s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

/* ========== COVER SLIDE ========== */
.slide-cover{background-size:cover;background-position:center;position:relative;}
.slide-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(95deg,rgba(13,27,42,0.92) 0%,rgba(13,27,42,0.7) 45%,rgba(13,27,42,0.25) 100%);}
.slide-cover .cover-inner{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;}
.slide-cover .eyebrow{font-family:'Playfair Display';font-style:italic;color:var(--gold);font-size:clamp(15px,1.4vw,18px);letter-spacing:3px;text-transform:uppercase;margin-bottom:18px;}
.slide-cover h1{font-family:'Playfair Display',serif;font-size:clamp(40px,5.5vw,72px);font-weight:700;line-height:1.05;color:var(--text);margin-bottom:18px;max-width:900px;}
.slide-cover h1 em{color:var(--gold);font-style:italic;font-weight:400;}
.slide-cover .subtitle{font-size:clamp(18px,1.8vw,24px);color:var(--muted);margin-bottom:34px;max-width:700px;line-height:1.4;font-weight:300;}
.slide-cover .tags{display:flex;gap:10px;flex-wrap:wrap;}
.slide-cover .tag{background:rgba(200,164,90,0.16);border:1px solid var(--gold);border-radius:20px;padding:6px 16px;font-size:13px;color:var(--gold-light);letter-spacing:0.5px;}
.slide-cover .author-line{margin-top:auto;font-family:'Playfair Display';font-style:italic;color:var(--muted);font-size:16px;}
.slide-cover .author-line strong{color:var(--gold-light);font-style:normal;font-weight:600;}

/* ========== STANDARD SLIDE ========== */
.slide-std{background:var(--navy);}
.slide-header{background:var(--navy2);padding:14px 52px;border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:18px;flex-shrink:0;}
.section-tag{background:rgba(200,164,90,0.18);border:1px solid var(--gold);border-radius:14px;padding:4px 14px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-light);font-weight:600;flex-shrink:0;font-family:'Source Sans 3';}
.slide-header h2{font-family:'Playfair Display',serif;font-size:clamp(24px,2.8vw,38px);color:var(--text);font-weight:700;line-height:1.2;}
.slide-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 52px;overflow-y:auto;}

/* ========== SPLIT SLIDE ========== */
.slide-split .body-row{flex:1;display:flex;overflow:hidden;}
.img-panel{width:36%;position:relative;overflow:hidden;flex-shrink:0;animation:fadeUp .6s ease;}
.img-panel img{width:100%;height:100%;object-fit:cover;display:block;}
.img-panel::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(13,27,42,0.55) 0%,rgba(13,27,42,0) 60%);pointer-events:none;}
.img-caption{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;background:linear-gradient(180deg,rgba(13,27,42,0) 0%,rgba(13,27,42,0.85) 80%);font-style:italic;color:rgba(255,255,255,0.85);font-size:14px;font-family:'Playfair Display';text-align:center;z-index:2;}
.content-panel{flex:1;padding:22px 44px 22px 36px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;}

/* ========== CARDS ========== */
.cards-2,.cards-3,.cards-4{display:grid;gap:14px;margin:6px 0;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;gap:12px;}
.cards-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;}
.card{background:var(--navy2);border:1px solid rgba(255,255,255,0.09);border-radius:7px;padding:16px 18px;animation:fadeUp .5s ease both;}
.card:nth-child(1){animation-delay:.06s;}
.card:nth-child(2){animation-delay:.14s;}
.card:nth-child(3){animation-delay:.22s;}
.card:nth-child(4){animation-delay:.30s;}
.card h3{font-family:'Playfair Display',serif;font-size:clamp(15px,1.5vw,20px);font-weight:700;margin-bottom:8px;color:var(--gold-light);line-height:1.25;}
.card p,.card li{font-size:clamp(14px,1.3vw,17px);line-height:1.5;color:var(--muted);}
.card ul,.card ol{margin-left:18px;margin-top:4px;}
.card.teal{border-color:var(--teal);}
.card.teal h3{color:var(--teal-light);}
.card.brown{border-color:var(--brown);}
.card.brown h3{color:var(--brown-light);}
.card.gold{border-color:var(--gold);}
.card.gold h3{color:var(--gold-light);}
.card.center-dark{border:2px solid var(--gold);background:var(--navy3);}
.card.center-dark h3{color:var(--gold-light);}

/* ========== QUOTE BANNER ========== */
.quote-banner{background:var(--navy3);border-left:5px solid var(--gold);border-radius:4px;padding:15px 22px;margin-bottom:16px;font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(16px,1.75vw,22px);color:var(--text);line-height:1.45;animation:fadeUp .5s ease;}
.quote-banner.center{text-align:center;}
.quote-banner small{display:block;font-size:13px;color:var(--gold-light);font-style:normal;font-family:'Source Sans 3';margin-top:8px;letter-spacing:0.5px;}

/* ========== TABLE ========== */
.comp-table{width:100%;border-collapse:collapse;font-size:clamp(14px,1.3vw,17px);margin:6px 0;}
.comp-table th{font-family:'Playfair Display',serif;font-size:16px;padding:12px 14px;text-align:left;border-bottom:2px solid var(--gold);}
.comp-table th:first-child{color:var(--muted);}
.comp-table th.col-brown{background:rgba(139,58,42,0.15);color:var(--brown-light);}
.comp-table th.col-teal{background:rgba(42,122,106,0.15);color:var(--teal-light);}
.comp-table td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.08);line-height:1.45;color:var(--muted);vertical-align:top;animation:fadeUp .5s ease both;}
.comp-table td:first-child{font-weight:600;color:var(--text);}
.comp-table tr:hover td{background:rgba(200,164,90,0.04);}
.comp-table td.col-brown{background:rgba(139,58,42,0.06);}
.comp-table td.col-teal{background:rgba(42,122,106,0.06);}

/* ========== ITEM ROWS ========== */
.items-list{display:flex;flex-direction:column;gap:9px;}
.item-row{display:flex;align-items:flex-start;gap:14px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:6px;animation:fadeUp .5s ease both;}
.item-row:nth-child(1){animation-delay:.06s;}
.item-row:nth-child(2){animation-delay:.14s;}
.item-row:nth-child(3){animation-delay:.22s;}
.item-row:nth-child(4){animation-delay:.30s;}
.item-row:nth-child(5){animation-delay:.38s;}
.item-row:nth-child(6){animation-delay:.46s;}
.item-row:nth-child(7){animation-delay:.54s;}
.step-num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--navy3);border:2px solid var(--gold);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:'Playfair Display';}
.step-num.teal{background:var(--teal);border-color:var(--teal-light);color:#fff;}
.step-num.brown{background:rgba(139,58,42,0.5);border-color:var(--brown-light);color:#fdd;}
.item-row .item-text{flex:1;font-size:clamp(13px,1.25vw,16px);line-height:1.5;color:var(--muted);padding-top:3px;}
.item-row .item-text strong{color:var(--text);font-weight:600;}

/* ========== FOOTER NOTE ========== */
.footer-note{margin-top:14px;padding-top:12px;border-top:1px solid rgba(200,164,90,0.22);font-family:'Playfair Display',serif;font-style:italic;color:var(--gold-light);font-size:clamp(13px,1.25vw,17px);text-align:center;line-height:1.5;}

/* ========== KEY FORMULA ========== */
.key-formula{background:linear-gradient(135deg,rgba(200,164,90,0.08),rgba(200,164,90,0.02));border:1px solid var(--gold);border-radius:8px;padding:18px 24px;margin:10px 0;text-align:center;font-family:'Playfair Display',serif;font-size:clamp(16px,1.7vw,21px);color:var(--gold-light);font-weight:700;letter-spacing:0.5px;line-height:1.35;animation:fadeUp .5s ease;}

/* ========== DIVIDER SLIDE ========== */
.slide-divider{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 50%,var(--navy3) 100%);justify-content:center;align-items:center;text-align:center;}
.slide-divider .div-section{font-family:'Playfair Display';font-style:italic;color:var(--gold);font-size:clamp(20px,2vw,28px);letter-spacing:6px;margin-bottom:20px;text-transform:uppercase;}
.slide-divider h1{font-family:'Playfair Display',serif;font-size:clamp(36px,4.5vw,60px);color:var(--text);font-weight:700;line-height:1.15;max-width:900px;padding:0 40px;margin-bottom:24px;}
.slide-divider .div-subtitle{font-family:'Playfair Display';font-style:italic;color:var(--muted);font-size:clamp(16px,1.6vw,22px);max-width:700px;padding:0 40px;line-height:1.5;}
.slide-divider .div-deco{width:80px;height:2px;background:var(--gold);margin:30px auto;}

/* ========== CLOSING SLIDE ========== */
.slide-close{background:var(--navy);justify-content:center;align-items:center;text-align:center;padding:50px 80px;}
.close-quote{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(17px,2.1vw,28px);color:var(--text);max-width:900px;line-height:1.45;margin-bottom:34px;position:relative;padding:0 40px;}
.close-quote::before{content:"\201C";position:absolute;top:-30px;left:0;font-size:80px;color:var(--gold);font-family:'Playfair Display';opacity:0.5;}
.close-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:760px;width:100%;margin-bottom:36px;}
.close-cards .card h3{font-size:18px;}
.close-logo{font-family:'Playfair Display';font-style:italic;color:var(--gold);font-size:14px;letter-spacing:2px;}

/* ========== TWO-COL FLEX ========== */
.two-col{display:flex;gap:18px;align-items:stretch;}
.two-col > *{flex:1;}

/* ========== THREE-COL FAN ========== */
.three-fan{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:6px 0;}
.three-fan .fan-arrow{font-size:32px;color:var(--gold);font-family:'Playfair Display';font-weight:700;}

/* ========== SCROLLBAR ========== */
.slide-body::-webkit-scrollbar,.content-panel::-webkit-scrollbar{width:6px;}
.slide-body::-webkit-scrollbar-thumb,.content-panel::-webkit-scrollbar-thumb{background:rgba(200,164,90,0.3);border-radius:3px;}

/* ========== UTILITIES ========== */
.text-gold{color:var(--gold-light);}
.text-teal{color:var(--teal-light);}
.text-brown{color:var(--brown-light);}
.fw-bold{font-weight:700;}
.fst-italic{font-style:italic;}
.mb-1{margin-bottom:8px;}
.mb-2{margin-bottom:14px;}

/* ========== RESPONSIVE ========== */
@media (max-width:768px){
  .slide-cover .cover-inner{padding:30px;}
  .slide-header{padding:12px 20px;}
  .slide-body{padding:18px 20px;}
  .content-panel{padding:18px 20px;}
  .img-panel{width:100%;}
  .slide-split .body-row{flex-direction:column;}
  .img-panel{height:38%;}
  .cards-3{grid-template-columns:1fr;}
  .cards-4{grid-template-columns:1fr;grid-template-rows:auto;}
  #prev-btn,#next-btn{width:38px;height:38px;}
  #nav-panel{width:80%;}
  .three-fan{grid-template-columns:1fr;}
  .three-fan .fan-arrow{display:none;}
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="counter">1 / 56</div>
<button class="nav-arrow" id="prev-btn">‹</button>
<button class="nav-arrow" id="next-btn">›</button>
<button id="nav-toggle">☰</button>
<aside id="nav-panel"></aside>
<main id="slides-container"></main>

<script>
/* ============================================================
   SLIDES DATA — Ernest Gellner: Müslüman Toplum
   Hazırlayan: Hatice Cengiz
   ============================================================ */
const SLIDES = [

{
  type:'cover',

  body:`

  `
},

/* ---------- 1. GELLNER HAYAT ---------- */
{
  type:'split',
  section:'Giriş',
  title:'Ernest Gellner — Hayatı ve Çalışmaları',
  image:'02_gellner_portrait.jpg',
  imageCaption:'Ernest André Gellner (1925–1995)',
  body:`
    <div class="quote-banner">Çek-Yahudi kökenli, Britanya'da yetişmiş, Avrupa'nın çöküşüne ve yeniden kuruluşuna tanık olmuş bir entelektüel.<small>13 yaşında kaçtığı Prag'a, 68 yaşında profesör olarak geri döndü.</small></div>

      <div class="card gold">
        <h3>Akademik Yolculuk</h3>

      </div>
      <div class="card gold">
        <h3>Dört Büyük Alan</h3>
        <p>Linguistic philosophy eleştirisi · Mağrip antropolojisi · İslam sosyolojisi · Milliyetçilik kuramı.</p>
      </div>
      <div class="card teal">
        <h3>Övgüler</h3>
        <p>Tony Judt: <em>"20. yüzyılın son büyük Aydınlanma düşünürü."</em> Talal Asad bile İslam'a ciddi yaklaşmış nadir Batılı sosyolog olarak değerlendirdi.</p>
      </div>
      <div class="card brown">
        <h3>Eleştiriler</h3>

      </div>
    </div>
    <div class="footer-note">Üç şeye karşı: postmodernizm, romantik milliyetçilik, olağan dil felsefesi. Üçüne karşı akıl, bilim, evrensel insan değerleri.</div>
  `
},

/* ---------- 2. KAVRAM HARITASI ---------- */
{
  type:'std',
  section:'Giriş',
  title:'Kavram Haritası — Gellner ve Diğer Düşünürler',
  body:`
    <div class="cards-4">
      <div class="card teal">
        <h3>⬆ Destek Aldıkları (Meşruiyet)</h3>
        <p><strong>Tocqueville · Hegel · Hodgson · Charnay</strong></p>
        <p style="margin-top:6px;font-size:14px;font-style:italic;">Gellner'in tezini onaylayan, otorite için çağrılan isimler.</p>

    </div>
    <div class="footer-note">Gellner'in tezi tek bir geleneğin uzantısı değil, üç koldan örülmüş bir sentezdir.</div>
  `

/* ---------- 3. TEMEL CERCEVE ---------- */
{
  type:'std',
  section:'Bölüm 1',
  title:'Gellner\'in Temel Çerçevesi',
  body:`
    <div class="key-formula">İSLAM, TOPLUMSAL BİR DÜZEN PROJESİDİR.</div>
    <div class="quote-banner center">Neden İslam modern dünyada diğer dinlerin aksine varlığını güçlü bir şekilde sürdürebiliyor?</div>
    <div class="cards-4">
      <div class="card brown">
        <h3>Hristiyanlık</h3>
        <p>Modern dünyada inancını tanınamayacak ölçüde yeniden yorumlamak zorunda kaldı. Sekülerleşmenin en büyük kanıtı.</p>
      </div>
      <div class="card brown">
        <h3>Konfüçyüsçülük</h3>
        <p>Kendi yurdunda — Çin'de — reddedildi.</p>
      </div>
      <div class="card brown">
        <h3>Hinduizm</h3>
        <p>Halk dini olarak devam ediyor; seçkinler ne onaylıyor ne reddediyor.</p>
      </div>
      <div class="card teal">
        <h3>İslam</h3>
        <p>Hem halkı hem geleneği kapsayan ciddi bir din olarak ayakta kalmayı sürdürüyor. <strong>İstisnai konumda.</strong></p>
      </div>

/* ============================================================
   RENDER ENGINE
   ============================================================ */
const container = document.getElementById('slides-container');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
const navPanel = document.getElementById('nav-panel');
const navToggle = document.getElementById('nav-toggle');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

let current = 0;

function renderSlides(){
  container.innerHTML = '';
  navPanel.innerHTML = '';

  SLIDES.forEach((slide, i) => {
    const el = document.createElement('section');
    el.className = 'slide';
    el.dataset.index = i;

    if (slide.type === 'cover'){
      el.classList.add('slide-cover');
      el.style.backgroundImage = `url('${slide.image}')`;
      el.innerHTML = `<div class="cover-inner">${slide.body}</div>`;
    }
    else if (slide.type === 'divider'){
      el.classList.add('slide-divider');
      el.innerHTML = slide.body;
    }
    else if (slide.type === 'close'){
      el.classList.add('slide-close');
      el.innerHTML = slide.body;
    }
    else if (slide.type === 'split'){
      el.classList.add('slide-split');
      el.innerHTML = `
        <div class="slide-header">
          <span class="section-tag">${slide.section}</span>
          <h2>${slide.title}</h2>
        </div>
        <div class="body-row">
          <div class="img-panel">
            <img src="${slide.image}" alt="${slide.imageCaption || ''}" onerror="this.style.background='linear-gradient(135deg,#1e3048,#152233)';this.alt='[ ${slide.image} ]';">
            ${slide.imageCaption ? `<div class="img-caption">${slide.imageCaption}</div>` : ''}
          </div>
          <div class="content-panel">${slide.body}</div>
        </div>
      `;
    }
    else { // std
      el.classList.add('slide-std');
      el.innerHTML = `
        <div class="slide-header">
          <span class="section-tag">${slide.section}</span>
          <h2>${slide.title}</h2>
        </div>
        <div class="slide-body">${slide.body}</div>
      `;
    }

    container.appendChild(el);

    // nav panel item
    const navItem = document.createElement('div');
    navItem.className = 'nav-item';
    navItem.dataset.index = i;
    navItem.innerHTML = `
      <div class="nav-section">${slide.section}</div>
      <div class="nav-title">${slide.title}</div>
    `;
    navItem.addEventListener('click', () => { goTo(i); navPanel.classList.remove('open'); });
    navPanel.appendChild(navItem);
  });
  goTo(0);
}

function goTo(n){
  if (n < 0) n = SLIDES.length - 1;
  if (n >= SLIDES.length) n = 0;
  current = n;
  document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(s => s.classList.remove('active'));
  const slide = container.querySelector(`.slide[data-index="${n}"]`);
  const navItem = navPanel.querySelector(`.nav-item[data-index="${n}"]`);
  if (slide) slide.classList.add('active');
  if (navItem){
    navItem.classList.add('active');
    navItem.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  counter.textContent = `${n + 1} / ${SLIDES.length}`;
  progress.style.width = `${((n + 1) / SLIDES.length) * 100}%`;
}

/* navigation events */
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
navToggle.addEventListener('click', () => navPanel.classList.toggle('open'));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); goTo(current + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); goTo(current - 1); }
  else if (e.key === 'Home'){ e.preventDefault(); goTo(0); }
  else if (e.key === 'End'){ e.preventDefault(); goTo(SLIDES.length - 1); }
  else if (e.key === 'Escape'){ navPanel.classList.remove('open'); }
});

/* touch swipe */
let touchStartX = 0, touchEndX = 0;
container.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
container.addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  const dx = touchEndX - touchStartX;
  if (Math.abs(dx) > 50){
    if (dx < 0) goTo(current + 1);
    else goTo(current - 1);
  }
}, {passive:true});

/* boot */
renderSlides();
</script>
